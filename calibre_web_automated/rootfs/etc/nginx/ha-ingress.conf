# nginx config for Home Assistant Ingress -> Calibre-Web Automated
#
# HA serves the add-on under /api/hassio_ingress/<token>/, strips that prefix
# from the request path and sends it in the X-Ingress-Path header. Calibre-Web
# supports subpaths natively through the X-Script-Name header, so this proxy
# mostly just renames the header.

worker_processes 1;
daemon off;
pid /tmp/nginx-ingress.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    # Book uploads and long conversions
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    server {
        listen 8099 default_server;

        # Only the Home Assistant Supervisor may talk to the ingress port
        allow 172.30.32.2;
        deny  all;

        # While CWA is still booting, show an auto-refreshing page
        # instead of a raw 502
        error_page 502 504 /addon-starting.html;
        location = /addon-starting.html {
            internal;
            root /etc/nginx/html;
            try_files /starting.html =502;
        }

        location / {
            proxy_pass http://127.0.0.1:8083;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Script-Name $http_x_ingress_path;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_buffering off;
            proxy_request_buffering off;

            # A few CWA-specific pages build absolute URLs in JavaScript
            # instead of using url_for(); put the ingress prefix in front.
            # Links rendered by Calibre-Web itself already carry the prefix
            # and do not match these patterns.
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter_types application/javascript text/javascript;
            sub_filter '"/cwa-'          '"$http_x_ingress_path/cwa-';
            sub_filter "'/cwa-"          "'$http_x_ingress_path/cwa-";
            sub_filter '`/cwa-'          '`$http_x_ingress_path/cwa-';
            sub_filter "'/duplicates/"   "'$http_x_ingress_path/duplicates/";
            sub_filter "'/magicshelf/"   "'$http_x_ingress_path/magicshelf/";
            sub_filter '`/ajax/'         '`$http_x_ingress_path/ajax/';
            sub_filter 'href="/admin/'   'href="$http_x_ingress_path/admin/';
            sub_filter 'href="/book/'    'href="$http_x_ingress_path/book/';
            sub_filter "'/static/"       "'$http_x_ingress_path/static/";
        }
    }
}

configuration:
  hardcover_token:
    name: Hardcover API token
    description: >-
      Optional. Leave empty to use the token from Calibre-Web Automated: your
      CWA profile, the CWA app options or CWA's Basic Configuration. Needed
      to browse your Hardcover lists, such as Want to Read.
  tor:
    name: Route traffic through Tor
    description: >-
      Send all of Shelfmark's internet traffic (searches, downloads and
      Hardcover) through Tor. Starting takes up to a few minutes, some sources
      block Tor, and the app stops instead of leaking traffic when Tor fails.
      Turn on the watchdog to have it restarted.
  ingress_auto_login:
    name: Log in automatically in Home Assistant
    description: >-
      Opening the app from Home Assistant logs you in as the same user as the
      Calibre-Web Automated app (its automatic login must be on). The direct
      port 8084 then cannot be used; turn this off to use it.
  use_cwa_login:
    name: Log in with Calibre-Web Automated users
    description: >-
      When not logged in automatically: log in with your Calibre-Web
      Automated username and password. Turn off to set up login in
      Shelfmark's own settings.
  extra_env:
    name: Extra environment variables
    description: Advanced, additional Shelfmark environment variables.
network:
  8084/tcp: Web interface (direct access, not needed for Ingress)

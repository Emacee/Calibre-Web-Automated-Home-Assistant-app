name: Shelfmark
version: "1.5.1.1"
slug: shelfmark
description: >-
  Search and download books, also from your Hardcover lists, straight into
  the Calibre-Web Automated ingest folder.
url: https://github.com/Emacee/Calibre-Web-Automated-Home-Assistant-app
arch:
  - aarch64
  - amd64
# The image brings dumb-init as its own init
init: false
startup: application
boot: auto

ingress: true
ingress_port: 8099
panel_icon: mdi:book-search
panel_title: Shelfmark
panel_admin: false

# Tor routing (option "tor") rewrites the container's iptables; Home
# Assistant cannot grant capabilities per option, so they are always asked
# for. They only matter when Tor is on.
privileged:
  - NET_ADMIN
  - NET_RAW

# With the watchdog switched on, Home Assistant restarts the app when it
# stops unexpectedly, e.g. when Tor fails and the app stops itself rather
# than sending traffic outside Tor. nginx is up from the start, also while
# Tor is still connecting.
watchdog: tcp://[HOST]:8099

# Direct access is off by default: Ingress is enough in the browser
ports:
  8084/tcp: null
ports_description:
  8084/tcp: Web interface (direct access, not needed for Ingress)

# /config        = Shelfmark settings and database (app_config, in backups)
# /share, /media = ingest folder of Calibre-Web Automated
# /app_configs   = read-only, to pick up the CWA folders, Hardcover token and
#                  user database from the Calibre-Web Automated app
map:
  - type: app_config
    read_only: false
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: all_app_configs
    read_only: true

# Downloads always go to the ingest folder of the Calibre-Web Automated app.
# hardcover_token is an optional override of the token set in that app.
options:
  tor: false
  ingress_auto_login: true
  use_cwa_login: true
  want_to_read_auto_download: true
  want_to_read_interval_hours: 6
  want_to_read_move_when_imported: true
  extra_env: []

schema:
  hardcover_token: password?
  tor: bool
  ingress_auto_login: bool
  use_cwa_login: bool
  want_to_read_auto_download: bool
  want_to_read_interval_hours: int(1,168)
  want_to_read_move_when_imported: bool
  extra_env:
    - name: str
      value: str

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="5">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelfmark is starting…</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif;
           background: #111; color: #eee; margin: 0; height: 100vh;
           display: flex; align-items: center; justify-content: center; }
    .box { text-align: center; max-width: 26rem; padding: 1.5rem; }
    .spin { width: 36px; height: 36px; margin: 0 auto 1rem;
            border: 4px solid #444; border-top-color: #eee;
            border-radius: 50%; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    h2 { font-weight: 600; margin: 0 0 .5rem; }
    p { color: #999; font-size: .875rem; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h2>Shelfmark is starting…</h2>
    <p>The first start takes a minute or so while the browser and
       settings are prepared. This page refreshes itself.</p>
  </div>
</body>
</html>

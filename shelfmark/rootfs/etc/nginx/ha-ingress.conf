# nginx config for Home Assistant Ingress -> Shelfmark
#
# HA serves the app under /api/hassio_ingress/<token>/, strips that prefix
# from the request path and sends it in the X-Ingress-Path header. The
# Shelfmark frontend builds every URL (API, assets, Socket.IO) from the
# <base href> in index.html, so putting the prefix there is all it needs.

worker_processes 1;
pid /tmp/nginx-ingress.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8099 default_server;

        # Only the Home Assistant Supervisor may talk to the ingress port
        allow 172.30.32.2;
        deny  all;

        # While Shelfmark is still booting, show an auto-refreshing page
        # instead of a raw 502
        error_page 502 504 /app-starting.html;
        location = /app-starting.html {
            internal;
            root /etc/nginx/html;
            try_files /starting.html =502;
        }

        location / {
            proxy_pass http://127.0.0.1:8084;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            # Socket.IO live updates
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;

            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '<base href="/" data-shelfmark-base' '<base href="$http_x_ingress_path/" data-shelfmark-base';
        }
    }
}
